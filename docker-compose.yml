version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lobnos-server
    restart: unless-stopped
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USERNAME=primelab
      - DB_PASSWORD=Barcelona45##
    ports:
      - "5000:5000"
      - "6000:6000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: lobnos-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=Barcelona45##
      - MYSQL_DATABASE=limsdb
      - MYSQL_USER=primelab
      - MYSQL_PASSWORD=Barcelona45##
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u$$MYSQL_USER", "-p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
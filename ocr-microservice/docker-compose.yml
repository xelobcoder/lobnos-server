version: "3.8"

services:
  ocr-microservice:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./processed:/app/processed
      - ./results:/app/results
      - ./debug:/app/debug
      - ./logs:/app/logs
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - UPLOAD_DIR=/app/uploads
      - PROCESSED_DIR=/app/processed
      - RESULTS_DIR=/app/results
      - DEBUG_DIR=/app/debug
      - LOGS_DIR=/app/logs
      - MAX_FILE_SIZE=10485760 # 10MB
      - OCR_TIMEOUT=30
      - PADDLE_CONFIDENCE_THRESHOLD=0.7
      - TESSERACT_CONFIDENCE_THRESHOLD=0.6
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
